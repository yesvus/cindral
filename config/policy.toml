[hosted]
runner = "ubuntu-24.04"

[quota]
minimum_remaining_minutes = 20
reserve_minutes = 10
paid_overage = "deny"
unknown_quota = "local"

[local]
priority = ["fallback"]
device_priority = ["desktop", "laptop", "phone"]

# Lane labels are matched against the runners registered to the repository the
# job runs in, not against fleet state. Every self-hosted runner on this account
# is ARM64 and carries exactly these three labels, so a lane that adds a class
# label of its own ("fallback", "device") matches nothing and the job queues
# forever. The burst lane is the exception: burst-node really is registered
# with a "burst" label, so that one keeps it.
[lanes.fallback]
labels = ["self-hosted", "Linux", "ARM64"]

# Device lanes are selected by target, so the runner name is appended per
# request and the class label is not needed here.
[lanes.device]
labels = ["self-hosted", "Linux", "ARM64"]

[lanes.burst]
labels = ["self-hosted", "Linux", "ARM64", "burst"]
