[hosted]
runner = "ubuntu-24.04"

[quota]
minimum_remaining_minutes = 20
reserve_minutes = 10
paid_overage = "deny"
unknown_quota = "local"

[local]
priority = ["fallback", "device"]
device_priority = ["desktop", "laptop", "phone"]

[lanes.fallback]
labels = ["self-hosted", "Linux", "ARM64", "fallback"]

[lanes.device]
labels = ["self-hosted", "Linux", "ARM64", "device"]

[lanes.burst]
labels = ["self-hosted", "Linux", "ARM64", "burst"]
