[hosted]
runner = "ubuntu-24.04"

[quota]
minimum_remaining_minutes = 20
reserve_minutes = 10
paid_overage = "deny"
unknown_quota = "local"

[local]
priority = ["fallback"]
device_priority = ["desktop", "laptop", "phone"]

# Fallback requires its own custom label so GitHub cannot assign this lane to a
# runner registered only for a device target.
[lanes.fallback]
labels = ["self-hosted", "Linux", "ARM64", "fallback"]

# Device lanes are selected by target, so the runner name is appended per request.
[lanes.device]
labels = ["self-hosted", "Linux", "ARM64"]

[lanes.burst]
labels = ["self-hosted", "Linux", "ARM64", "burst"]
