# .cindral/ci.toml
[image]
ref = "python:3.12-bookworm"

[runner]
docker = true

[[steps]]
run = "pip install --quiet -e ."

[[steps]]
run = "python scripts/check_file_limits.py"

[[steps]]
run = "python -m compileall -q src"

[[steps]]
run = "python -m unittest discover -s tests"

# The control panel is a separate toolchain, so it is checked in a node
# container against the daemon this contract already mounts.
[[steps]]
run = "docker run --rm -v \"$PWD/web:/app\" -w /app node:22-bookworm sh -lc 'corepack enable && pnpm install --frozen-lockfile && pnpm run ci'"

# The panel ships as a container, so the runtime image is built and booted
# here. An import or runtime failure in the standalone server only surfaces
# once the image actually starts.
[[steps]]
run = "docker build -t cindral-panel:ci web"

[[steps]]
run = "docker run --rm -d --name cindral-panel-ci -p 127.0.0.1:8099:3000 -e CINDRAL_PANEL_PASSWORD=ci -e CINDRAL_SESSION_SECRET=ci-secret cindral-panel:ci && sleep 5 && curl -fsS -o /dev/null http://127.0.0.1:8099/login && docker rm -f cindral-panel-ci"

# Unit tests run against an editable install, so they cannot detect a
# dependency the Dockerfile forgets to install. That only surfaces when the
# built image imports the module, which is how a missing PyYAML reached a
# pushed tag while every test passed.
[[steps]]
run = "docker build -t cindral:ci ."

[[steps]]
run = "docker run --rm cindral:ci --help"

[[steps]]
run = "docker run --rm --entrypoint python cindral:ci -c \"import cindral.onboarding\""
