name: cindral-dispatch

on:
  workflow_dispatch:
    inputs:
      cindral_lane:
        required: true
        type: choice
        options:
          - hosted
          - fallback
          - device
          - burst
      cindral_target:
        required: false
        type: string
        default: ""
      cindral_reason:
        required: false
        type: string
        default: ""
      cindral_ref:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: cindral-${{ github.workflow }}-${{ inputs.cindral_ref || github.ref }}
  cancel-in-progress: false

jobs:
  hosted:
    if: inputs.cindral_lane == 'hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - run: ./scripts/ci

  fallback:
    if: inputs.cindral_lane == 'fallback'
    # The custom label keeps device-only runners out of the fallback lane.
    runs-on: [self-hosted, Linux, ARM64, fallback]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - run: ./scripts/ci

  device:
    if: inputs.cindral_lane == 'device' && (inputs.cindral_target == 'papyrus' || inputs.cindral_target == 'rover' || inputs.cindral_target == 'colak')
    # Selected by runner name, which is the label GitHub registers each device
    # with, so no class label is needed.
    runs-on: [self-hosted, Linux, ARM64, "${{ inputs.cindral_target }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - run: ./scripts/ci

  burst:
    if: inputs.cindral_lane == 'burst'
    runs-on: [self-hosted, Linux, ARM64, burst]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.cindral_ref || github.ref }}
      - run: ./scripts/ci
