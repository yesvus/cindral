name: relay-dispatch

on:
  workflow_dispatch:
    inputs:
      relay_lane:
        required: true
        type: choice
        options:
          - hosted
          - fallback
          - device
          - burst
      relay_target:
        required: false
        type: string
        default: ""
      relay_reason:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: relay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted:
    if: inputs.relay_lane == 'hosted'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/ci

  fallback:
    if: inputs.relay_lane == 'fallback'
    # The custom label keeps device-only runners out of the fallback lane.
    runs-on: [self-hosted, Linux, ARM64, fallback]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/ci

  device:
    if: inputs.relay_lane == 'device' && (inputs.relay_target == 'desktop' || inputs.relay_target == 'laptop' || inputs.relay_target == 'phone')
    # Selected by runner name, which is the label GitHub registers each device
    # with, so no class label is needed.
    runs-on: [self-hosted, Linux, ARM64, "${{ inputs.relay_target }}"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/ci

  burst:
    if: inputs.relay_lane == 'burst'
    runs-on: [self-hosted, Linux, ARM64, burst]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/ci
