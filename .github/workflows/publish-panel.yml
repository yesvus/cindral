name: publish-panel

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/publish-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN cannot push to a package that is not linked to this
          # repository, so a scoped PAT with write:packages is used instead.
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      # The deployment pins :0.1.0, so a push to main republishes that tag.
      # The image is also tagged with the commit, so a specific build stays
      # addressable after a later main lands.
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cindral-panel:0.1.0
            ghcr.io/${{ github.repository_owner }}/cindral-panel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
