name: publish-panel

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/publish-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    # A Next.js build under arm64 emulation is far slower than a native one
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # The cluster node is arm64 while this runner is amd64, so the foreign
      # architecture is built under emulation. Without both of these the pushed
      # image carries only the runner's platform and the cluster cannot pull it.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN cannot push to a package that is not linked to this
          # repository, so a scoped PAT with write:packages is used instead.
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      # The deployment pins :0.1.0, so a push to main republishes that tag.
      # The image is also tagged with the commit, so a specific build stays
      # addressable after a later main lands.
      - uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/cindral-panel:0.1.0
            ghcr.io/${{ github.repository_owner }}/cindral-panel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A digest that resolves in the registry can still have no entry for the
      # cluster's architecture, and a pin to it takes the panel down on rollout.
      # Fail here instead, where the image is not yet referenced by anything.
      - name: Check the published image runs on both architectures
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/cindral-panel:0.1.0"
          found=$(docker buildx imagetools inspect "$image" --raw \
            | jq -r '.manifests[].platform.architecture' | sort -u | tr '\n' ' ')
          echo "published architectures: $found"
          for arch in amd64 arm64; do
            case " $found " in
              *" $arch "*) ;;
              *) echo "::error::published image has no $arch manifest"; exit 1 ;;
            esac
          done
