name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/check.py

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Unit tests run against an editable install, so they cannot detect a
      # dependency the Dockerfile forgets to install. That only surfaces when
      # the built image imports the module, which is how a missing PyYAML
      # reached a pushed tag while every test passed.
      - run: docker build -t cindral:ci .
      - run: docker run --rm cindral:ci --help
      - run: docker run --rm --entrypoint python cindral:ci -c "import cindral.onboarding"

  panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      # `defaults.run.working-directory` applies to `run:` steps only, never to `uses:`, so this action
      # was looking for package.json at the repository root. The root has no `packageManager` field and
      # the job died on "No pnpm version is specified" before it installed anything. The panel's
      # manifest, which does carry `packageManager: pnpm@12.4.1`, is named explicitly here instead.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
