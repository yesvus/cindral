[project]
name = "cindral"
version = "0.7.0"
description = "Quota-aware GitHub Actions routing across hosted and self-hosted runners."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
cindral = "cindral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cindral"]
