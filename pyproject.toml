[project]
name = "cindral"
version = "0.9.0"
description = "Quota-aware GitHub Actions routing across hosted and self-hosted runners."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
cindral = "cindral.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cindral"]

[tool.cindral.code_quality]
max_lines_src = 400
max_lines_test = 650
baseline_overrides = { "src/cindral/service.py" = 675, "src/cindral/executor.py" = 415 }

[tool.pylint.design]
max-line-per-file = 400

