[project]
name = "runner-relay"
version = "0.5.0"
description = "Quota-aware GitHub Actions routing across hosted and self-hosted runners."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
runner-relay = "runner_relay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runner_relay"]
